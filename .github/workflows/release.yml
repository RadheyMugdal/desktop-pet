# Builds installers for Windows, macOS and Linux and attaches them to a GitHub
# release. Push a tag like v0.1.0 to publish (or run it by hand to just get the
# files as build artifacts). Installers get fixed names so the website's
# "releases/latest/download/<name>" links always point at the newest version.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - run: npx tauri build ${{ matrix.args }}

      - name: Collect installers under stable names
        shell: bash
        run: |
          mkdir dist
          t=src-tauri/target
          case "$RUNNER_OS" in
            Windows)
              cp "$t"/release/bundle/nsis/*-setup.exe dist/DesktopPet-windows-x64-setup.exe ;;
            macOS)
              cp "$t"/universal-apple-darwin/release/bundle/dmg/*.dmg dist/DesktopPet-macos-universal.dmg ;;
            Linux)
              cp "$t"/release/bundle/appimage/*.AppImage dist/DesktopPet-linux-x86_64.AppImage
              cp "$t"/release/bundle/deb/*.deb dist/DesktopPet-linux-amd64.deb ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: dist/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
