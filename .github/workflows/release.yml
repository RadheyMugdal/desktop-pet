# Builds installers for Windows, macOS and Linux and attaches them to a GitHub
# release. Push a tag like v0.1.0 to publish (or run it by hand to just get the
# files as build artifacts). Installers get fixed names so the website's
# "releases/latest/download/<name>" links always point at the newest version.
#
# Installed copies update themselves from latest.json, which the last job
# writes. Every update must be signed: add the private key from
# ~/.tauri/desktop-pet.key as the repository secret TAURI_SIGNING_PRIVATE_KEY.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - run: npx tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Collect installers under stable names
        shell: bash
        run: |
          mkdir dist
          t=src-tauri/target
          case "$RUNNER_OS" in
            Windows)
              cp "$t"/release/bundle/nsis/*-setup.exe dist/DesktopPet-windows-x64-setup.exe
              cp "$t"/release/bundle/nsis/*-setup.exe.sig dist/DesktopPet-windows-x64-setup.exe.sig ;;
            macOS)
              m="$t"/universal-apple-darwin/release/bundle
              cp "$m"/dmg/*.dmg dist/DesktopPet-macos-universal.dmg
              cp "$m"/macos/*.app.tar.gz dist/DesktopPet-macos-universal.app.tar.gz
              cp "$m"/macos/*.app.tar.gz.sig dist/DesktopPet-macos-universal.app.tar.gz.sig ;;
            Linux)
              cp "$t"/release/bundle/appimage/*.AppImage dist/DesktopPet-linux-x86_64.AppImage
              cp "$t"/release/bundle/appimage/*.AppImage.sig dist/DesktopPet-linux-x86_64.AppImage.sig
              cp "$t"/release/bundle/deb/*.deb dist/DesktopPet-linux-amd64.deb ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: dist/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # Tells installed copies about this version (see plugins.updater in tauri.conf.json).
  update-manifest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: Write latest.json
        run: |
          python3 - <<'PY'
          import datetime, json, os
          tag = os.environ['GITHUB_REF_NAME']
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"
          mac = 'DesktopPet-macos-universal.app.tar.gz'
          files = {
              'windows-x86_64': 'DesktopPet-windows-x64-setup.exe',
              'darwin-aarch64': mac,
              'darwin-x86_64': mac,
              'linux-x86_64': 'DesktopPet-linux-x86_64.AppImage',
          }
          platforms = {
              key: {'url': base + name, 'signature': open(f'dist/{name}.sig').read().strip()}
              for key, name in files.items()
              if os.path.exists(f'dist/{name}.sig')
          }
          manifest = {
              'version': tag.lstrip('v'),
              'notes': f'Desktop Pet {tag}',
              'pub_date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': platforms,
          }
          json.dump(manifest, open('latest.json', 'w'), indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - uses: softprops/action-gh-release@v2
        with:
          files: latest.json
